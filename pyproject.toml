[project]
name = "mutfak-asistani"
version = "0.1.0"
description = "AI Weekend 201 mutfak asistanı — Langflow mutfak track'inin LangGraph portu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain==1.5.2",
    "langchain-openai==1.8.5",
    "langchain-tavily==0.2.18",
    "langchain-xai==1.4.1",
    "langgraph==1.2.24",
    "langsmith==0.16.0",
    "numpy==2.5.5",
    "pypdf==7.1.1",
    "truststore==0.10.5",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]==0.4.43",
    "grandalf>=0.8",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutfak_asistani"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "mutfak_asistani/_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: gerçek grok çağrısı yapar (XAI_API_KEY gerekir)"]
